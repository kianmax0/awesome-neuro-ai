name: Suggest a resource
description: Propose a useful NeuroAI learning resource, paper, tool, dataset, benchmark, or community resource.
title: "Resource: "
body:
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Canonical URL
      description: Prefer an author, publisher, institution, or maintainer page.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested destination
      description: Choose the resource's primary type. Papers belong in topics; tools, datasets, and benchmarks have separate resource pages. Learning routes and projects link to canonical entries.
      options:
        - "Learn: programming, mathematics, textbooks, or reviews"
        - "Learn: courses, tutorials, or public lectures"
        - "Topics: research or methods paper"
        - "Resources: software, simulators, or task environments"
        - "Resources: datasets or data archives"
        - "Resources: benchmarks and evaluations"
        - "Community: collections, conversations, conferences, or training"
        - "Start here or Projects: improve a route or exercise"
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why include it?
      description: Explain its NeuroAI relevance, scientific question, intended readers, useful background, and what they can learn or do. Propose a short factual description.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification and limitations
      description: Explain what you checked or used. Note publication status, access restrictions, dependencies, or maintenance concerns.
    validations:
      required: true
  - type: textarea
    id: relationship
    attributes:
      label: Relationship to the resource
      description: Disclose if you are an author, maintainer, or affiliated with the project; otherwise write none.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched the canonical pages in learn, topics, resources, and community for this resource and read CONTRIBUTING.md.
          required: true
